<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse ou crie sua conta no CBI Café.">
    <title>Entrar - CBI Café</title>
    <link rel="stylesheet" href="/Front/Asseds/Cores.css">
    <link rel="stylesheet" href="/Front/Asseds/Login.css">
    <link rel="stylesheet" href="/Front/Asseds/HeaderFooter.css">
    <script src="../Asseds/Login.js" defer></script>
    <script src="../Asseds/HeaderMain.Js" defer></script>
</head>
<body>
    <header></header>
    <main class="auth-page">
        <section class="auth-card" aria-label="Acesso à conta">
            <div class="auth-heading">
                <p class="eyebrow">CBI Café</p>
                <h2 id="form-title">Bem-vindo de volta</h2>
                <p id="form-description">Entre com seus dados para continuar.</p>
            </div>

            <div class="auth-tabs" role="tablist" aria-label="Tipo de acesso">
                <button class="auth-tab is-active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-panel">Entrar</button>
                <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-panel">Criar conta</button>
            </div>

            <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

            <form id="login-panel" class="auth-form" data-form="login" role="tabpanel" aria-labelledby="login-tab">
                <div class="field-group">
                    <label for="login-email">E-mail</label>
                    <input id="login-email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
                </div>
                <div class="field-group">
                    <div class="field-label-row">
                        <label for="login-password">Senha</label>
                        <span class="field-hint">Mínimo de 8 caracteres</span>
                    </div>
                    <input id="login-password" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" minlength="8" required>
                </div>
                <button class="submit-button" type="submit">Entrar na conta <span aria-hidden="true">→</span></button>
            </form>

            <form id="register-panel" class="auth-form is-hidden" data-form="register" role="tabpanel" aria-labelledby="register-tab" hidden>
                <div class="field-group">
                    <label for="register-name">Nome completo</label>
                    <input id="register-name" name="nome" type="text" autocomplete="name" placeholder="Como podemos chamar você?" minlength="3" required>
                </div>
                <div class="field-group">
                    <label for="register-email">E-mail</label>
                    <input id="register-email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
                </div>
                <div class="field-group">
                    <label for="register-password">Crie uma senha</label>
                    <input id="register-password" name="senha" type="password" autocomplete="new-password" placeholder="Use pelo menos 8 caracteres" minlength="8" required>
                </div>
                <button class="submit-button" type="submit">Criar minha conta <span aria-hidden="true">→</span></button>
            </form>

            <p class="privacy-note">Ao continuar, você concorda com o uso dos seus dados sem restrição </p>
        </section>
    </main>
    <footer></footer>
</body>
</html>
