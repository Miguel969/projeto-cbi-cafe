<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Pedidos</title>
    <link rel="stylesheet" href="../Asseds/Cores.css">
    <link rel="stylesheet" href="../Asseds/PedidosCss.css">
    <script src="../Asseds/HeaderMain.Js" defer></script>
    <script src="../Asseds/PedidoMain.js"defer></script>

</head>

<body>
    <header></header>
    <main>
        <h2>Lista de pedidos ativos</h2>
        <div class="ListaPedidos" id="ListaPedidos">
            <div class="CardPedido">
                <div class="TopCard">
                    <span>#50000</span>
                    <span class="Timer">00:00</span>
                    <button><img src="../Asseds/IconeProblema.png" alt=""></button>
                </div>
                <div class="Produtos">
                    <span>Cafè grande 1x</span>
                </div>
                <div class="BtEntregar">
                    <button>Pedido Pronto</button>
                </div>
            </div>
        </div>
        <div class="ModalProblemaCusto">
            <form id="FormStatusCustom">
                <label for="">Status atual:</label>
                <input type="text" name="" id="">
                <label for="">Observação:</label>
                <textarea name="" id=""></textarea>
                <div class="AtualizarBt">
                    <button>Atualizar</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
